name: Release RAM Macros

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to publish, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ram-macros-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    env:
      PLUGIN_ID: io.github.codysimonds65.ram.macros
      PLUGIN_NAME: RAM Macros
      REQUESTED_VERSION: ${{ inputs.version }}

    steps:
      - name: Check out release source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Determine and validate version
        id: version
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$env:REQUESTED_VERSION" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Release version must be semantic version vMAJOR.MINOR.PATCH; received '$tag'." }
          $plugin = Get-Content -Raw -LiteralPath 'plugin.json' | ConvertFrom-Json
          $manifest = Get-Content -Raw -LiteralPath 'manifest.json' | ConvertFrom-Json
          [xml]$project = Get-Content -Raw -LiteralPath 'ram-macros.csproj'
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          if ($plugin.id -ne $env:PLUGIN_ID -or $manifest.id -ne $env:PLUGIN_ID) { throw "Plugin identity does not match '$env:PLUGIN_ID'." }
          if ($plugin.version -ne $manifest.version) { throw "plugin.json and manifest.json versions must match." }
          if ($projectVersion -ne $plugin.version) { throw "ram-macros.csproj Version '$projectVersion' does not match plugin version '$($plugin.version)'." }
          if ($plugin.version -ne $tag.Substring(1)) { throw "Plugin version '$($plugin.version)' does not match release tag '$tag'." }

          $tagCommit = (git rev-list -n 1 $tag 2>$null)
          if ($tagCommit -and $tagCommit.Trim() -ne $env:GITHUB_SHA) { throw "Existing tag '$tag' does not point to this release commit." }
          $version = [version]$plugin.version
          $latest = @(git tag --list 'v*' | ForEach-Object {
              if ($_ -match '^v(\d+)\.(\d+)\.(\d+)$') { [pscustomobject]@{ Tag = $_; Version = [version]$_.Substring(1) } }
          } | Sort-Object Version -Descending | Select-Object -First 1)
          if ($latest.Count -gt 0 -and $version -lt $latest[0].Version) { throw "Plugin version $version is older than the latest tag $($latest[0].Tag)." }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "commit=$env:GITHUB_SHA" >> $env:GITHUB_OUTPUT

      - name: Run tests
        shell: pwsh
        run: dotnet run --project .\tests\RamMacros.Tests.csproj -c Release --nologo

      - name: Build unsigned package
        shell: pwsh
        run: |
          $release = Join-Path $env:RUNNER_TEMP 'ram-macros-release'
          $stage = Join-Path $release 'stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          dotnet publish .\ram-macros.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o $stage
          Copy-Item .\plugin.json (Join-Path $stage 'plugin.json') -Force
          $zip = Join-Path $release 'plugin.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content (Join-Path $release 'plugin.sha256') -NoNewline
          Copy-Item .\plugin.json (Join-Path $release 'plugin.json') -Force

      - name: Upload unsigned package for isolated signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ram-macros-package
          path: ${{ runner.temp }}/ram-macros-release/*
          if-no-files-found: error

  sign-and-publish:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PLUGIN_NAME: RAM Macros

    steps:
      - name: Download unsigned package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ram-macros-package
          path: release

      - name: Sign and verify package
        shell: pwsh
        env:
          RAM_PLUGIN_SIGNING_KEY: ${{ secrets.RAM_PLUGIN_SIGNING_KEY }}
          RAM_PLUGIN_SIGNING_PUBLIC_KEY: ${{ secrets.RAM_PLUGIN_SIGNING_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RAM_PLUGIN_SIGNING_KEY)) { throw 'RAM_PLUGIN_SIGNING_KEY is required for official releases.' }
          if ([string]::IsNullOrWhiteSpace($env:RAM_PLUGIN_SIGNING_PUBLIC_KEY)) { throw 'RAM_PLUGIN_SIGNING_PUBLIC_KEY is required for official releases.' }
          $privatePath = Join-Path $env:RUNNER_TEMP 'ram-plugin-signing-private.pem'
          $publicPath = Join-Path $env:RUNNER_TEMP 'ram-plugin-signing-public.pem'
          try {
              [IO.File]::WriteAllText($privatePath, $env:RAM_PLUGIN_SIGNING_KEY, [Text.UTF8Encoding]::new($false))
              [IO.File]::WriteAllText($publicPath, $env:RAM_PLUGIN_SIGNING_PUBLIC_KEY, [Text.UTF8Encoding]::new($false))
              & openssl pkeyutl -sign -inkey $privatePath -in '.\release\plugin.zip' -out '.\release\plugin.sig'
              if ($LASTEXITCODE -ne 0) { throw "Package signing failed with exit code $LASTEXITCODE." }
              & openssl pkeyutl -verify -pubin -inkey $publicPath -in '.\release\plugin.zip' -sigfile '.\release\plugin.sig'
              if ($LASTEXITCODE -ne 0) { throw 'The package signature did not verify with the configured public key.' }
          } finally {
              Remove-Item -LiteralPath $privatePath, $publicPath -Force -ErrorAction SilentlyContinue
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_TARGET: ${{ needs.build.outputs.commit }}
        run: |
          gh release create $env:RELEASE_TAG '.\release\plugin.json#plugin.json' '.\release\plugin.zip#plugin.zip' '.\release\plugin.sha256#plugin.sha256' '.\release\plugin.sig#plugin.sig' --repo $env:GITHUB_REPOSITORY --target $env:RELEASE_TARGET --title "$env:PLUGIN_NAME $env:RELEASE_TAG" --generate-notes --fail-on-no-commits
